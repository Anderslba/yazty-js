<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="yatzy.js" defer></script>
    <script src="dom.js" defer></script>
    <title>Yatzy</title>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="dicerow">
                <div class="dice" id="die1"><img src="Terninger/blank.png"></div>
                <div class="dice" id="die2"><img src="Terninger/blank.png"></div>
                <div class="dice" id="die3"><img src="Terninger/blank.png"></div>
                <div class="dice" id="die4"><img src="Terninger/blank.png"></div>
                <div class="dice" id="die5"><img src="Terninger/blank.png"></div>
            </div>
            <button id="roll-button">Roll Dice</button>
            <button id="reset-button">Reset Game</button>
            <div class="scoreboard">
                <h2>Scoreboard</h2>
                <ul id="score-list">
                    <!-- Scores will be dynamically added here -->
                </ul>
            </div>
    </div>
</body>
</html>
