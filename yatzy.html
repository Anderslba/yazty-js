<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="yatzy.js" defer></script>
    <script src="dom.js" defer></script>
    <title>Yatzy</title>
</head>
<body>
    <div class="wrapper">
        <div class="upper-part">
            <div class="dice-container">
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
            </div>

            <div class="controls">
                <div><span>Turn: </span><span id="turn">0</span></div>
                <button class="button" id="roll-button">Roll</button>
            </div>
        </div>

        <div class="score-container">
            <div class="score">1-s<input type="text" value="2"></div>
            <div class="score">2-s<input type="text" value="2"></div>
            <div class="score">3-s<input type="text" value="0"></div>
            <div class="score">4-s<input type="text" value="8"></div>
            <div class="score">5-s<input type="text" value="5"></div>

            <div class="score">6-s<input type="text" value="0">Sum:<input type="number" class="sum" value="">Bonus:<input type="number" class="bonus"value=""></div>

            <div class="score">One pair         <input type="text" value="8"></div>
            <div class="score">Two pairs        <input type="text" value="0"></div>
            <div class="score">Three same       <input type="text" value="0"></div>
            <div class="score">Four same        <input type="text" value="0"></div>
            <div class="score">Full house       <input type="text" value="0"></div>
            <div class="score">Small straight   <input type="text" value="0"></div>
            <div class="score">Large straight   <input type="text" value="0"></div>
            <div class="score">Chance           <input type="text" value="0"></div>
            <div class="score">Yatzy            <input type="text" value="0"></div>
        </div>
           
    </div>
    <button id ="reset-button">Start et nyt spil</button>
</body>
</html>
