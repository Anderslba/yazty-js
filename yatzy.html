<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="yatzy.js" defer></script>
    <script src="dom.js" defer></script>
    <title>Yatzy</title>
</head>
<body>
    <div class="wrapper">
        <div class="upper-part">
            <div class="dice-container">
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
                <div class="dice"><img src="images/blank.png"></div>
            </div>

            
            <div class="turn"><span>Turn: </span><span id="turn">0</span></div>
            <button id="roll-button">Roll</button>
            
        </div>

        <div class="score-container">

            <div class="sum">
                <label for="sum">Sum: </label>
                <input readonly name="sum" type="number" value="0">
            </div>

            <div class="bonus">
                <label for="bonus">Bonus: </label>
                <input readonly type="number" name="bonus" value="0">
            </div>

            <div class="total">
                <label for="total">Total: </label>
                <input readonly type="number" name="total" value="0">
            </div>

        </div>
           
    </div>
    <button id ="reset-button">Start et nyt spil</button>
</body>
</html>
